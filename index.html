<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadir Point</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050a10'/%3E%3Cpath d='M2 9h12M8 3v10' stroke='%237fd4ff' stroke-width='1.2'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfe3ef; }
      #viewport { position: fixed; inset: 0; display: block; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #000; color: #7fd4ff; letter-spacing: 0.35em; font-size: 12px;
        transition: opacity 500ms ease; z-index: 100;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>
    <div id="boot">NADIR POINT</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
