<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Nadir Point</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <section class="panel" id="hud">
      <header>NADIR POINT <span class="dim">· M0 TESTBED</span></header>
      <div id="stats"></div>
    </section>

    <section class="panel" id="keys">
      <header>CONTROLS</header>
      <div class="row"><span class="k">DRAG · 2-FINGER</span><span class="v">PAN</span></div>
      <div class="row"><span class="k">WHEEL · PINCH</span><span class="v">ZOOM</span></div>
      <div class="row"><span class="k">WASD · Q E</span><span class="v">PAN · ZOOM</span></div>
      <div class="row"><span class="k">SPACE · 1–6</span><span class="v">PAUSE · SPEED</span></div>
      <div class="row"><span class="k">R · B · H</span><span class="v">NEW SEED · BLUR · HUD</span></div>
    </section>

    <div id="banner" class="panel" hidden></div>
    <section id="bench" class="panel" hidden><pre></pre></section>
    <div id="fatal" class="panel" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
