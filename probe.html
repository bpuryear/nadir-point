<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadir Point — probe</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050a10'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #viewport { position: fixed; inset: 0; display: block; }
      #label {
        position: fixed; left: 12px; top: 10px; z-index: 10;
        font: 11px/1.5 ui-monospace, Menlo, monospace; color: #6f8ea0;
        letter-spacing: 0.12em; text-transform: uppercase; pointer-events: none;
      }
      #err {
        position: fixed; inset: 0; display: none; place-items: center; padding: 40px;
        font: 12px/1.7 ui-monospace, Menlo, monospace; color: #ff7b7b;
        white-space: pre-wrap; background: #000; z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="label"></div>
    <div id="err"></div>
    <script type="module" src="/src/probe.js"></script>
  </body>
</html>
